name: Push

on: push

jobs:
  test:
    name: Lint, build, and test on node 24.x and ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Use Node.js 24.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint codebase
        run: pnpm lint
      - name: Build codebase
        run: pnpm build
      - name: Test codebase
        run: pnpm test --run --coverage
      - name: Upload coverage
        run: bash <(curl -s https://codecov.io/bash)

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Use Node.js 24.x
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build codebase
        run: pnpm build
      - name: Publish
        # pnpm, not npm, so the OIDC token from id-token: write is exchanged
        # for npm trusted publishing credentials. --no-git-checks because the
        # tag is checked out as a detached HEAD, which pnpm otherwise rejects
        # for not being a publish branch.
        run: pnpm publish --access public --no-git-checks
